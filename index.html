    // --- Audio Engine ---
    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    const sfx = {
      correct: () => { playTone(587.33, 'sine', 0.13, 0); playTone(880, 'sine', 0.22, 0.09); },

              <div class="text-lg mb-1">❤️</div>

            <div class="bg-slate-950/80 border border-amber-500/20 p-3.5 rounded-2xl">
              <div class="text-lg mb-1">⏱️</div>
              <div class="font-bold text-sky-300 text-xs sm:text-sm">30s Per Question</div>

    function enterExam() {
      const inputEl = document.getElementById('studentNameInput');

      sfx.click();
      renderMap();

    // --- Screen 2: Stage Map ---
    function renderMap() {
      clearInterval(state.timerInterval);
      state.screen = 'map';
      updateHeader();

      const allCompleted = Object.keys(state.completedStages).length === STAGES.length;

      const cardsHtml = STAGES.map(stage => {
        const isUnlocked = stage.id <= state.unlockedStage;
        const stars = state.completedStages[stage.id] || 0;
        return `
          <div onclick="${isUnlocked ? `startStage(${stage.id})` : ''}" 
               class="stage-card luxury-card rounded-2xl p-5 relative overflow-hidden ${isUnlocked ? 'cursor-pointer' : 'locked opacity-50 cursor-not-allowed'}">
            <div class="flex items-start justify-between mb-3">

    // --- Screen 3: Quiz Gameplay ---
    function startStage(stageId) {
      sfx.click();
      state.currentStageId = stageId;
      state.qIndex = 0;
      state.hearts = 3;
      state.streak = 0;
      state.stageScore = 0;
      state.correctCount = 0;
      state.lifelines = { fifty: true, hint: true, freeze: true };
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(state.timerInterval);
      state.answered = false;
      state.hiddenOptions = [];
      state.showHintBox = false;
      state.timeFrozen = false;
      state.timer = 30;

      renderQuizUI();

      state.timerInterval = setInterval(() => {
        if (state.answered || state.timeFrozen) return;
        state.timer--;
        const timerEl = document.getElementById('timerText');
        const barEl = document.getElementById('timerBar');
        if (timerEl) timerEl.textContent = `${state.timer}s`;
        if (barEl) {
          const pct = Math.max(0, (state.timer / 30) * 100);
          barEl.style.width = `${pct}%`;
          if (state.timer <= 7) barEl.className = "h-full bg-rose-500 transition-all duration-300";
        }
        if (state.timer <= 0) {
          clearInterval(state.timerInterval);
          handleAnswer(-1);
        }
      }, 1000);
    }

    function renderQuizUI(selectedIdx = null) {
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const qObj = stage.questions[state.qIndex];
      const letters = ['A', 'B', 'C', 'D'];

      const heartsHtml = [1, 2, 3].map(h => 
        `<span class="text-base ${h <= state.hearts ? 'opacity-100' : 'opacity-25 grayscale'}">❤️</span>`
      ).join('');

      const optionsHtml = qObj.options.map((opt, idx) => {
        if (state.hiddenOptions.includes(idx)) {
          return `<div class="p-3.5 rounded-2xl border border-slate-800/50 bg-slate-950/40 text-slate-600 text-sm italic">Eliminated via 50:50</div>`;
        }
        let btnStyle = "bg-slate-950/85 border-slate-800 text-slate-100";
        let badgeStyle = "bg-slate-900 text-amber-400 border border-amber-500/30";

        if (state.answered) {
          if (idx === qObj.correct) {
            btnStyle = "bg-emerald-950/90 border-emerald-400 text-emerald-100 shadow-lg shadow-emerald-500/15";
            badgeStyle = "bg-emerald-500 text-slate-950";
          } else if (idx === selectedIdx) {
            btnStyle = "bg-rose-950/90 border-rose-500 text-rose-100 animate-shake";
            badgeStyle = "bg-rose-500 text-white";
          } else {
            btnStyle = "bg-slate-950/40 border-slate-800/60 text-slate-500";
          }
        }

        return `
          <button onclick="handleAnswer(${idx})" ${state.answered ? 'disabled' : ''} 
                  class="option-btn w-full text-left p-3.5 sm:p-4 rounded-2xl border ${btnStyle} flex items-center gap-3.5">
            <span class="w-8 h-8 rounded-xl ${badgeStyle} font-black text-xs flex items-center justify-center shrink-0">
              ${letters[idx]}
            </span>
            <span class="text-sm sm:text-base font-semibold leading-snug">${opt}</span>
          </button>
        `;
      }).join('');

      app.innerHTML = `
        <div class="luxury-card rounded-3xl p-5 sm:p-7 animate-pop">
          <!-- Top HUD -->
          <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-800">
            <div class="flex items-center gap-2">
              <button onclick="renderMap()" class="text-xs bg-slate-900 hover:bg-slate-800 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700">✕ Exit</button>
              <span class="text-xs font-bold text-amber-300 bg-amber-500/10 px-3 py-1 rounded-lg border border-amber-400/25">
                ${stage.title.split(':')[0]} • Question ${state.qIndex + 1}/${stage.questions.length}
              </span>
            </div>

            <div class="flex items-center gap-3">
              ${state.streak >= 2 ? `<span class="text-xs font-black text-amber-400 bg-amber-500/15 px-2.5 py-1 rounded-lg">🔥 ${state.streak}x</span>` : ''}
              <div class="flex items-center gap-0.5">${heartsHtml}</div>
              <div class="text-xs font-black px-2.5 py-1 rounded-lg ${state.timeFrozen ? 'bg-sky-500/20 text-sky-300' : 'bg-slate-900 text-white border border-slate-700'}">
                ⏱️ <span id="timerText">${state.timeFrozen ? 'Frozen' : state.timer + 's'}</span>
              </div>
            </div>
          </div>

          <!-- Timer Progress Bar -->
          <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden mb-5">
            <div id="timerBar" class="h-full bg-gradient-to-r from-amber-400 to-sky-400 transition-all duration-300" style="width: ${(state.timer / 30) * 100}%"></div>
          </div>

          <!-- Question Text -->
          <h3 class="text-base sm:text-lg font-extrabold text-white leading-relaxed mb-5">
            ${qObj.q}
          </h3>

          <!-- Lifelines Bar -->
          <div class="flex flex-wrap items-center gap-2 mb-5">
            <span class="text-xs text-slate-400 font-semibold mr-1">Lifelines:</span>
            <button onclick="useFiftyFifty()" ${!state.lifelines.fifty || state.answered ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${state.lifelines.fifty && !state.answered ? 'bg-sky-950/80 border-sky-500/40 text-sky-300 hover:bg-sky-900' : 'bg-slate-950 border-slate-800 text-slate-600 cursor-not-allowed'}">
              ✂️ 50:50
            </button>
            <button onclick="useHint()" ${!state.lifelines.hint || state.answered ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${state.lifelines.hint && !state.answered ? 'bg-amber-950/80 border-amber-500/40 text-amber-300 hover:bg-amber-900' : 'bg-slate-950 border-slate-800 text-slate-600 cursor-not-allowed'}">
              💡 Hint
            </button>
            <button onclick="useFreeze()" ${!state.lifelines.freeze || state.answered ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${state.lifelines.freeze && !state.answered ? 'bg-indigo-950/80 border-indigo-500/40 text-indigo-300 hover:bg-indigo-900' : 'bg-slate-950 border-slate-800 text-slate-600 cursor-not-allowed'}">
              ❄️ Freeze Clock
            </button>
          </div>

          <!-- Optional Hint Box -->
          ${state.showHintBox ? `
            <div class="mb-4 p-3.5 rounded-2xl bg-amber-500/10 border border-amber-400/35 text-amber-200 text-xs sm:text-sm flex items-start gap-2.5 animate-pop">
              <span class="text-base">💡</span>
              <div><strong>Study Hint:</strong> ${qObj.hint}</div>
            </div>
          ` : ''}

          <!-- Options Grid -->
          <div class="grid grid-cols-1 gap-3 mb-5">
            ${optionsHtml}
          </div>

          <!-- Clinical Explanation Card -->
          ${state.answered ? `
            <div class="p-4 rounded-2xl ${selectedIdx === qObj.correct ? 'bg-emerald-950/65 border-emerald-500/40' : 'bg-rose-950/65 border-rose-500/40'} border mb-4 animate-pop">

                ${selectedIdx === qObj.correct ? '✅ Great Job! Explanation:' : (selectedIdx === -1 ? '⏰ Time Up! Explanation:' : '❌ Not Quite — Explanation:')}

              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${qObj.explanation}</p>
            </div>
            <button onclick="nextStep()" class="gold-btn w-full py-3.5 rounded-2xl font-black text-base transition">
              ${state.hearts <= 0 ? 'View Module Results →' : (state.qIndex + 1 < stage.questions.length ? 'Next Question →' : 'Finish Module 🏆')}
            </button>
          ` : ''}
        </div>
      `;
    }

    // --- Lifelines ---
    function useFiftyFifty() {
      if (!state.lifelines.fifty || state.answered) return;
      sfx.click();
      state.lifelines.fifty = false;
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const correctIdx = stage.questions[state.qIndex].correct;
      const wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIdx).sort(() => Math.random() - 0.5);
      state.hiddenOptions = wrongIndices.slice(0, 2);
      renderQuizUI();
    }

    function useHint() {
      if (!state.lifelines.hint || state.answered) return;
      sfx.click();
      state.lifelines.hint = false;
      state.showHintBox = true;
      renderQuizUI();
    }

    function useFreeze() {
      if (!state.lifelines.freeze || state.answered) return;
      sfx.click();
      state.lifelines.freeze = false;
      state.timeFrozen = true;
      renderQuizUI();
    }

    // --- Answer Evaluation ---
    function handleAnswer(selectedIdx) {
      if (state.answered) return;
      state.answered = true;
      clearInterval(state.timerInterval);

      const stage = STAGES.find(s => s.id === state.currentStageId);
      const qObj = stage.questions[state.qIndex];

      if (selectedIdx === qObj.correct) {
        sfx.correct();
        state.streak++;
        state.correctCount++;
        const speedBonus = Math.round(state.timer * 3);
        const streakBonus = state.streak > 1 ? state.streak * 20 : 0;
        const points = 100 + speedBonus + streakBonus;
        state.stageScore += points;
        state.totalScore += points;
        updateHeader();
      } else {
        sfx.wrong();
        state.streak = 0;
        state.hearts--;
      }

      renderQuizUI(selectedIdx);
    }

    function nextStep() {
      sfx.click();
      const stage = STAGES.find(s => s.id === state.currentStageId);
      if (state.hearts <= 0 || state.qIndex + 1 >= stage.questions.length) {
        renderStageResult();
      } else {
        state.qIndex++;
        loadQuestion();
      }
    }

    // --- Screen 4: Stage Result ---
    function renderStageResult() {
      clearInterval(state.timerInterval);
      const stage = STAGES.find(s => s.id === state.currentStageId);
      // Student-friendly passing requirement: >= 3 out of 6 correct
      const passed = state.hearts > 0 && state.correctCount >= 3;

      let stars = 0;
      if (passed) {
        sfx.win();
        stars = state.correctCount === 6 ? 3 : (state.correctCount >= 4 ? 2 : 1);
        const prevStars = state.completedStages[stage.id] || 0;
        if (stars > prevStars) state.completedStages[stage.id] = stars;
        if (stage.id === state.unlockedStage && state.unlockedStage < STAGES.length) {
          state.unlockedStage++;
        }
      } else {
        sfx.wrong();
      }

      const hasNextStage = passed && stage.id < STAGES.length;
      const allCleared = Object.keys(state.completedStages).length === STAGES.length;

      app.innerHTML = `
        <div class="luxury-card rounded-3xl p-6 sm:p-10 text-center animate-pop max-w-xl mx-auto">

          <h2 class="text-2xl sm:text-3xl font-black text-white mb-2">
            ${passed ? 'Module Completed!' : 'Try Again!'}
          </h2>
          <p class="text-sm text-slate-300 mb-6">
            ${passed 
              ? `Well done! You passed ${stage.title}.` 
              : 'You need at least 3/6 correct answers with remaining hearts to unlock the next module.'}
          </p>

          <div class="flex justify-center gap-2 text-3xl mb-6">
            ${[1, 2, 3].map(i => `<span class="${i <= stars ? 'text-amber-400' : 'text-slate-700'}">★</span>`).join('')}

          <div class="grid grid-cols-2 gap-3 mb-7">

              <div class="text-xs text-slate-400 mb-1">Correct Answers</div>
              <div class="text-xl font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">${state.correctCount} / ${stage.questions.length}</div>
            </div>
            <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 mb-1">Module Score</div>
              <div class="text-xl font-black text-amber-400">+${state.stageScore}</div>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button onclick="startStage(${stage.id})" class="px-6 py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm border border-slate-700 transition">
              Replay Module ↻
            </button>
            ${allCleared ? `
              <button onclick="renderCertificate()" class="gold-btn px-8 py-3.5 rounded-2xl font-black text-sm transition">
                Claim MNU Certificate 📜
              </button>
            ` : (hasNextStage ? `
              <button onclick="startStage(${stage.id + 1})" class="gold-btn px-8 py-3.5 rounded-2xl font-black text-sm transition">
                Next Module →
              </button>
            ` : `
              <button onclick="renderMap()" class="gold-btn px-8 py-3.5 rounded-2xl font-black text-sm transition">
                Back to Modules 🗺️
              </button>
            `)}
          </div>
        </div>
      `;
    }

    // --- Screen 5: Official MNU Completion Certificate ---
    function renderCertificate() {
      sfx.win();
      app.innerHTML = `
        <div class="luxury-card rounded-3xl p-6 sm:p-10 text-center animate-pop max-w-3xl mx-auto border-2 border-amber-400/60">
          <div class="flex items-center justify-center gap-4 mb-5">

            <img src="pharmacy-logo.jpg" alt="Pharmacy" onerror="this.style.display='none'" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover logo-ring">
            <img src="pharma-dept-logo.jpg" alt="Pharmacology" onerror="this.style.display='none'" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full object-cover logo-ring">

          <div class="text-xs font-bold uppercase tracking-widest text-amber-400 mb-1">

          </div>
          <div class="text-xs text-sky-300 font-semibold mb-4">
            Department of Pharmacology & Toxicology
          </div>

          <h2 class="font-royal text-2xl sm:text-4xl font-black text-white mb-3">
            CERTIFICATE OF ACHIEVEMENT
          </h2>
          <p class="text-xs sm:text-sm text-slate-300 mb-3">This certifies that</p>
          <div class="text-2xl sm:text-3xl font-black text-amber-300 border-b border-amber-400/40 inline-block px-8 pb-2 mb-4">
            ${state.playerName}
          </div>
          <p class="text-xs sm:text-sm text-slate-300 max-w-xl mx-auto leading-relaxed mb-6">

          <div class="flex flex-wrap justify-center gap-3">
