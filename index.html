    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    const sfx = {
      correct: () => { playTone(587.33, 'sine', 0.13, 0); playTone(880, 'sine', 0.22, 0.09); },

      sfx.click();

      state.qIndex = 0;
      state.hearts = 2;
      state.streak = 0;
      state.stageScore = 0;
      state.correctCount = 0;
      state.lifelines = { fifty: true, hint: true, freeze: true };
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(state.timerInterval);
      const stage = STAGES.find(s => s.id === state.currentStageId);
      state.answered = false;
      state.hiddenOptions = [];
      state.showHintBox = false;
      state.timeFrozen = false;
      state.timer = stage.timePerQ;

      renderQuizUI();

      state.timerInterval = setInterval(() => {
        if (state.answered || state.timeFrozen) return;
        state.timer--;
        const timerEl = document.getElementById('timerText');
        const barEl = document.getElementById('timerBar');
        if (timerEl) timerEl.textContent = `${state.timer}s`;
        if (barEl) {
          const pct = Math.max(0, (state.timer / stage.timePerQ) * 100);
          barEl.style.width = `${pct}%`;
          if (state.timer <= 6) barEl.className = "h-full bg-rose-500 transition-all duration-300";
        }
        if (state.timer <= 0) {
          clearInterval(state.timerInterval);
          handleAnswer(-1);
        }
      }, 1000);
    }

        let badgeStyle = "bg-slate-900 text-amber-400 border border-amber-500/30";

          if (idx === qObj.correct) {
            btnStyle = "bg-emerald-950/90 border-emerald-400 text-emerald-100 shadow-lg shadow-emerald-500/15";

            btnStyle = "bg-rose-950/90 border-rose-500 text-rose-100 animate-shake";

      if (!state.lifelines.fifty || state.answered) return;
      sfx.click();
      state.lifelines.fifty = false;
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const correctIdx = stage.questions[state.qIndex].correct;
      const wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIdx).sort(() => Math.random() - 0.5);
      state.hiddenOptions = wrongIndices.slice(0, 2);
      renderQuizUI();
    }

    function useHint() {
      if (!state.lifelines.hint || state.answered) return;
      sfx.click();
      state.lifelines.hint = false;
      state.showHintBox = true;
      renderQuizUI();
    }

    function useFreeze() {
      if (!state.lifelines.freeze || state.answered) return;
      sfx.click();
      state.lifelines.freeze = false;
      state.timeFrozen = true;
      renderQuizUI();
    }

    // --- Answer Evaluation ---
    function handleAnswer(selectedIdx) {
      if (state.answered) return;
      state.answered = true;
      clearInterval(state.timerInterval);

      const stage = STAGES.find(s => s.id === state.currentStageId);
      const qObj = stage.questions[state.qIndex];

      if (selectedIdx === qObj.correct) {
        sfx.correct();
        state.streak++;
        state.correctCount++;
        const speedBonus = Math.round(state.timer * 4);
        const streakBonus = state.streak > 1 ? state.streak * 20 : 0;
        const points = 120 + speedBonus + streakBonus;
        state.stageScore += points;
        state.totalScore += points;
        updateHeader();
      } else {
        sfx.wrong();
        state.streak = 0;
        state.hearts--;
      }

      renderQuizUI(selectedIdx);
    }

    function nextStep() {
      sfx.click();
      const stage = STAGES.find(s => s.id === state.currentStageId);
      if (state.hearts <= 0 || state.qIndex + 1 >= stage.questions.length) {
        renderStageResult();
      } else {
        state.qIndex++;
        loadQuestion();
      }
    }

    // --- Screen 4: Stage Result ---
    function renderStageResult() {
      clearInterval(state.timerInterval);
      const stage = STAGES.find(s => s.id === state.currentStageId);
      // Hardcore passing requirement: >= 5 out of 6 correct
      const passed = state.hearts > 0 && state.correctCount >= 5;

      let stars = 0;
      if (passed) {
        sfx.win();
        stars = state.correctCount === 6 ? 3 : 2;
        const prevStars = state.completedStages[stage.id] || 0;
        if (stars > prevStars) state.completedStages[stage.id] = stars;
        if (stage.id === state.unlockedStage && state.unlockedStage < STAGES.length) {
          state.unlockedStage++;
        }
      } else {
        sfx.wrong();
      }

      const hasNextStage = passed && stage.id < STAGES.length;
      const allCleared = Object.keys(state.completedStages).length === STAGES.length;

      app.innerHTML = `
        <div class="luxury-card rounded-3xl p-6 sm:p-10 text-center animate-pop max-w-xl mx-auto">
          <div class="text-5xl mb-3">${passed ? '🏆' : '💔'}</div>
          <h2 class="text-2xl sm:text-3xl font-black text-white mb-2">
            ${passed ? 'Module Passed!' : 'Module Not Passed'}
          </h2>
          <p class="text-sm text-slate-300 mb-6">
            ${passed 
              ? `Excellent clinical judgment in ${stage.title}.` 
              : 'Board Standard: You must answer at least 5/6 cases correctly without losing both lives.'}
          </p>

          <div class="flex justify-center gap-2 text-3xl mb-6">
            ${[1, 2, 3].map(i => `<span class="${i <= stars ? 'text-amber-400' : 'text-slate-700'}">★</span>`).join('')}
          </div>

          <div class="grid grid-cols-2 gap-3 mb-7">
            <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 mb-1">Cases Solved</div>
              <div class="text-xl font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">${state.correctCount} / ${stage.questions.length}</div>
            </div>
            <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 mb-1">Module Score</div>
              <div class="text-xl font-black text-amber-400">+${state.stageScore}</div>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button onclick="startStage(${stage.id})" class="px-6 py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm border border-slate-700 transition">
              Retry Module ↻
            </button>
            ${allCleared ? `
              <button onclick="renderCertificate()" class="gold-btn px-8 py-3.5 rounded-2xl font-black text-sm transition">
                Claim MNU Certificate 📜
              </button>
            ` : (hasNextStage ? `
              <button onclick="startStage(${stage.id + 1})" class="gold-btn px-8 py-3.5 rounded-2xl font-black text-sm transition">
                Next Module →
              </button>
            ` : `
              <button onclick="renderMap()" class="gold-btn px-8 py-3.5 rounded-2xl font-black text-sm transition">
                Back to Modules 🗺️
              </button>
            `)}
          </div>
        </div>
      `;
    }

    // --- Screen 5: Official MNU Completion Certificate ---
    function renderCertificate() {
      sfx.win();
      app.innerHTML = `
        <div class="luxury-card rounded-3xl p-6 sm:p-10 text-center animate-pop max-w-3xl mx-auto border-2 border-amber-400/60">
          <div class="flex items-center justify-center gap-4 mb-5">
            <img src="mnu-logo.jpg" alt="MNU" onerror="this.style.display='none'" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full object-cover logo-ring">
            <img src="pharmacy-logo.jpg" alt="Pharmacy" onerror="this.style.display='none'" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover logo-ring">
            <img src="pharma-dept-logo.jpg" alt="Pharmacology" onerror="this.style.display='none'" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full object-cover logo-ring">
          </div>

          <div class="text-xs font-bold uppercase tracking-widest text-amber-400 mb-1">
            Mansoura National University • Faculty of Pharmacy
          </div>
          <div class="text-xs text-sky-300 font-semibold mb-4">
            Department of Pharmacology & Toxicology
          </div>

          <h2 class="font-royal text-2xl sm:text-4xl font-black text-white mb-3">
            CERTIFICATE OF CLINICAL MASTERY
          </h2>
          <p class="text-xs sm:text-sm text-slate-300 mb-3">This certifies that</p>
          <div class="text-2xl sm:text-3xl font-black text-amber-300 border-b border-amber-400/40 inline-block px-8 pb-2 mb-4">
            ${state.playerName}
          </div>
          <p class="text-xs sm:text-sm text-slate-300 max-w-xl mx-auto leading-relaxed mb-6">
            has successfully completed all <strong>6 Advanced Clinical Modules (36 Board Cases)</strong> in <em>Insulin Pharmacotherapy, ICU Crises & Toxicology</em> with a cumulative score of <strong class="text-amber-300">${state.totalScore} points</strong>.
          </p>

          <div class="flex flex-wrap justify-center gap-3">
            <button onclick="window.print()" class="gold-btn px-7 py-3 rounded-xl font-black text-sm">
              🖨️ Print / Save Certificate
            </button>
            <button onclick="renderMap()" class="px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-200 font-bold text-sm border border-slate-700">
              Back to Modules
            </button>
          </div>
        </div>
      `;
    }

    // Boot
    updateHeader();
    renderHome();
  </script>
</body>
</html>
