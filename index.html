<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MNU Pharmacology | Royal Insulin Clinical Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --mnu-navy: #07142b;
      --mnu-deep: #030814;
      --mnu-gold: #d4af37;
      --mnu-gold-bright: #f5d77f;
      --mnu-cyan: #38bdf8;
    }
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-royal { font-family: 'Cinzel', serif; }
    .font-arabic { font-family: 'Cairo', sans-serif; }
    
    body {
      background-color: var(--mnu-deep);
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(212, 175, 55, 0.16) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(14, 165, 233, 0.16) 0%, transparent 42%),
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 55%),
        linear-gradient(180deg, #061024 0%, #030814 100%);
    }

    .royal-panel {
      background: linear-gradient(160deg, rgba(12, 27, 56, 0.94) 0%, rgba(5, 13, 30, 0.98) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 55, 0.38);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.75),
        0 0 30px rgba(212, 175, 55, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .emblem-frame {
      background: #ffffff;
      border: 3px solid var(--mnu-gold);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.45), inset 0 0 8px rgba(7, 20, 43, 0.2);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .emblem-frame:hover {
      transform: scale(1.08) rotate(2deg);
      box-shadow: 0 0 35px rgba(245, 215, 127, 0.7);
    }

    .stage-card {
      background: linear-gradient(145deg, rgba(11, 24, 50, 0.9), rgba(6, 14, 32, 0.95));
      border: 1px solid rgba(212, 175, 55, 0.25);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stage-card:not(.locked):hover {
      transform: translateY(-6px);
      border-color: var(--mnu-gold-bright);
      box-shadow: 0 18px 40px rgba(212, 175, 55, 0.25);
    }

    .option-btn {
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .option-btn:not(:disabled):hover {
      transform: translateX(6px);
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.14), rgba(15, 35, 70, 0.98));
      border-color: var(--mnu-gold);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .gold-cta {
      background: linear-gradient(135deg, #c99e26 0%, #f5d77f 50%, #b58918 100%);
      color: #030814;
      box-shadow: 0 10px 28px rgba(212, 175, 55, 0.38);
      transition: all 0.25s ease;
    }
    .gold-cta:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(245, 215, 127, 0.5);
    }

    .gold-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.55), transparent);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake { animation: shake 0.42s ease-in-out; }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop { animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>

    <div class="gold-divider mb-3"></div>

  <script>
    // --- High-Resolution Official Emblem Renderers (Works Offline & Online Automatically) ---

              <span class="text-[8px] leading-none text-[#d4af37]">👑</span>
              <span class="font-black text-[11px] sm:text-xs tracking-tighter text-white leading-none mt-0.5">MNU</span>
              <span class="font-arabic text-[6px] text-[#f5d77f] leading-tight mt-0.5">المنصورة الأهلية</span>
            </div>
          </div>`;
      }
      if (type === 'pharmacy') {
        return `
          <div class="${sizeClass} rounded-full emblem-frame overflow-hidden flex items-center justify-center relative shrink-0" title="Faculty of Pharmacy - MNU">

                <path d="M22 39 H42 L41 43 H23 Z" fill="#d4af37"/>

    }

    document.getElementById('headerEmblems').innerHTML = 
      getEmblemHTML('mnu') + getEmblemHTML('pharmacy') + getEmblemHTML('dept');

    // --- Sound Engine ---
    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    const sfx = {
      correct: () => { playTone(587.33, 'sine', 0.13, 0); playTone(880, 'sine', 0.22, 0.09); },
      wrong: () => { playTone(190, 'sawtooth', 0.2, 0); playTone(145, 'sawtooth', 0.3, 0.14); },
      click: () => { playTone(520, 'triangle', 0.05, 0); },
      win: () => {
        playTone(523.25, 'sine', 0.14, 0);
        playTone(659.25, 'sine', 0.14, 0.11);
        playTone(783.99, 'sine', 0.14, 0.22);
        playTone(1046.50, 'sine', 0.38, 0.33);
      }
    };

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
    }

    // --- 6 Progressive Modules (36 Questions, Diverse Answer Positions + Dynamic Shuffle, Escalating Timer 30s -> 35s -> 40s) ---
    const STAGES = [
      {
        id: 1,

            explanation: "GLUT4 is the insulin-responsive glucose transporter in skeletal muscle and adipose tissue; GLUT1 and GLUT2 are insulin-independent."
          },
          {

          },
          {

          },
          {

    function loadQuestion() {
      clearInterval(state.timerInterval);
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const qObj = stage.questions[state.qIndex];

      // Shuffle options dynamically while preserving exact correct answer mapping
      const indexedOptions = qObj.options.map((text, idx) => ({
        text,
        isCorrect: idx === qObj.correct
      }));
      for (let i = indexedOptions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indexedOptions[i], indexedOptions[j]] = [indexedOptions[j], indexedOptions[i]];
      }
      state.currentShuffledOptions = indexedOptions.map(o => o.text);
      state.currentCorrectShuffledIdx = indexedOptions.findIndex(o => o.isCorrect);

      state.answered = false;
      state.hiddenOptions = [];
      state.showHintBox = false;
      state.timeFrozen = false;
      state.maxTime = stage.timePerQ;
      state.timer = stage.timePerQ;

      renderQuizUI();

      state.timerInterval = setInterval(() => {
        if (state.answered || state.timeFrozen) return;
        state.timer--;
        const timerEl = document.getElementById('timerText');
        const barEl = document.getElementById('timerBar');
        if (timerEl) timerEl.textContent = `${state.timer}s`;
        if (barEl) {
          const pct = Math.max(0, (state.timer / state.maxTime) * 100);
          barEl.style.width = `${pct}%`;
          if (state.timer <= 7) barEl.className = "h-full bg-rose-500 transition-all duration-300";
        }
        if (state.timer <= 0) {
          clearInterval(state.timerInterval);
          handleAnswer(-1);
        }
      }, 1000);
    }

            <div class="mb-4 p-3.5 rounded-2xl bg-amber-500/10 border border-amber-400/35 text-amber-200 text-xs sm:text-sm flex items-start gap-2.5 animate-pop">
              <span class="text-base">💡</span>
              <div><strong>Pharmacology Clue:</strong> ${qObj.hint}</div>
            </div>
          ` : ''}

          <!-- Options Grid -->
          <div class="grid grid-cols-1 gap-3 mb-5">
            ${optionsHtml}
          </div>

          <!-- Clinical Explanation Card -->
          ${state.answered ? `
            <div class="p-4 rounded-2xl ${selectedIdx === state.currentCorrectShuffledIdx ? 'bg-emerald-950/70 border-emerald-500/45' : 'bg-rose-950/70 border-rose-500/45'} border mb-4 animate-pop">
              <div class="font-black text-sm mb-1 ${selectedIdx === state.currentCorrectShuffledIdx ? 'text-emerald-300' : 'text-rose-300'}">
                ${selectedIdx === state.currentCorrectShuffledIdx ? '✅ Correct! Clinical Pearl:' : (selectedIdx === -1 ? '⏰ Time Expired — Clinical Pearl:' : '❌ Incorrect — Clinical Pearl:')}
              </div>
              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${qObj.explanation}</p>
            </div>
            <button onclick="nextStep()" class="gold-cta w-full py-3.5 rounded-2xl font-black text-base">
              ${state.hearts <= 0 ? 'View Module Results →' : (state.qIndex + 1 < stage.questions.length ? 'Next Clinical Case →' : 'Complete Module 🏆')}
            </button>
          ` : ''}
        </div>
      `;
    }

    // --- Lifelines ---
    function useFiftyFifty() {
      if (!state.lifelines.fifty || state.answered) return;
      sfx.click();
      state.lifelines.fifty = false;
      const wrongIndices = [0, 1, 2, 3].filter(i => i !== state.currentCorrectShuffledIdx).sort(() => Math.random() - 0.5);
      state.hiddenOptions = wrongIndices.slice(0, 2);
      renderQuizUI();
    }

    function useHint() {
      if (!state.lifelines.hint || state.answered) return;
      sfx.click();
      state.lifelines.hint = false;
      state.showHintBox = true;
      renderQuizUI();
    }

    function useFreeze() {
      if (!state.lifelines.freeze || state.answered) return;
      sfx.click();
      state.lifelines.freeze = false;
      state.timeFrozen = true;
      renderQuizUI();
    }

    // --- Answer Evaluation ---
    function handleAnswer(selectedIdx) {
      if (state.answered) return;
      state.answered = true;
      clearInterval(state.timerInterval);

      if (selectedIdx === state.currentCorrectShuffledIdx) {
        sfx.correct();
        state.streak++;
        state.correctCount++;
        const speedBonus = Math.round(state.timer * 3);
        const streakBonus = state.streak > 1 ? state.streak * 20 : 0;
        const points = 100 + speedBonus + streakBonus;
        state.stageScore += points;
        state.totalScore += points;
        updateHeader();
      } else {
        sfx.wrong();
        state.streak = 0;
        state.hearts--;
      }

      renderQuizUI(selectedIdx);
    }

    function nextStep() {
      sfx.click();
      const stage = STAGES.find(s => s.id === state.currentStageId);
      if (state.hearts <= 0 || state.qIndex + 1 >= stage.questions.length) {
        renderStageResult();
      } else {
        state.qIndex++;
        loadQuestion();
      }
    }

    // --- Screen 4: Stage Result ---
    function renderStageResult() {
      clearInterval(state.timerInterval);
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const passed = state.hearts > 0 && state.correctCount >= 3;

      let stars = 0;
      if (passed) {
        sfx.win();
        stars = state.correctCount === 6 ? 3 : (state.correctCount >= 4 ? 2 : 1);
        const prevStars = state.completedStages[stage.id] || 0;
        if (stars > prevStars) state.completedStages[stage.id] = stars;
        if (stage.id === state.unlockedStage && state.unlockedStage < STAGES.length) {
          state.unlockedStage++;
        }
      } else {
        sfx.wrong();
      }

      const hasNextStage = passed && stage.id < STAGES.length;
      const allCleared = Object.keys(state.completedStages).length === STAGES.length;

      app.innerHTML = `
        <div class="royal-panel rounded-3xl p-6 sm:p-10 text-center animate-pop max-w-xl mx-auto">
          <div class="text-5xl mb-3">${passed ? '🏆' : '💔'}</div>
          <h2 class="text-2xl sm:text-3xl font-black text-white mb-2">
            ${passed ? 'Module Completed!' : 'Try Again!'}
          </h2>
          <p class="text-sm text-slate-300 mb-6">
            ${passed 
              ? `Excellent work, ${state.playerName}! You cleared ${stage.title}.` 
              : 'You need at least 3/6 correct answers with remaining hearts to unlock the next module.'}
          </p>

          <div class="flex justify-center gap-2 text-3xl mb-6">
            ${[1, 2, 3].map(i => `<span class="${i <= stars ? 'text-amber-400' : 'text-slate-700'}">★</span>`).join('')}
          </div>

          <div class="grid grid-cols-2 gap-3 mb-7">
            <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 mb-1">Cases Solved</div>
              <div class="text-xl font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">${state.correctCount} / ${stage.questions.length}</div>
            </div>
            <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 mb-1">Module Score</div>
              <div class="text-xl font-black text-amber-400">+${state.stageScore}</div>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button onclick="startStage(${stage.id})" class="px-6 py-3.5 rounded-2xl bg-slate-950 hover:bg-slate-900 text-white font-bold text-sm border border-slate-700 transition">
              Replay Module ↻
            </button>
            ${allCleared ? `
              <button onclick="renderCertificate()" class="gold-cta px-8 py-3.5 rounded-2xl font-black text-sm">
                Claim MNU Certificate 📜
              </button>
            ` : (hasNextStage ? `
              <button onclick="startStage(${stage.id + 1})" class="gold-cta px-8 py-3.5 rounded-2xl font-black text-sm">
                Next Module →
              </button>
            ` : `
              <button onclick="renderMap()" class="gold-cta px-8 py-3.5 rounded-2xl font-black text-sm">
                Back to Modules 🗺️
              </button>
            `)}
          </div>
        </div>
      `;
    }

    // --- Screen 5: Official Royal MNU Certificate ---
    function renderCertificate() {
      sfx.win();
      app.innerHTML = `
        <div class="royal-panel rounded-3xl p-6 sm:p-10 text-center animate-pop max-w-3xl mx-auto border-2 border-amber-400/70 relative overflow-hidden">
          <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-amber-600 via-yellow-300 to-amber-600"></div>

          <div class="flex items-center justify-center gap-4 sm:gap-6 mb-5 mt-2">
            ${getEmblemHTML('mnu', 'w-14 h-14 sm:w-16 sm:h-16')}
            ${getEmblemHTML('pharmacy', 'w-16 h-16 sm:w-20 sm:h-20')}
            ${getEmblemHTML('dept', 'w-14 h-14 sm:w-16 sm:h-16')}
          </div>

          <div class="text-xs font-bold uppercase tracking-widest text-amber-400 mb-1">
            Mansoura National University • Faculty of Pharmacy
          </div>
          <div class="text-xs text-sky-300 font-semibold mb-4">
            Department of Pharmacology & Toxicology
          </div>

          <h2 class="font-royal text-2xl sm:text-4xl font-black text-white mb-3">
            CERTIFICATE OF CLINICAL ACHIEVEMENT
          </h2>
          <p class="text-xs sm:text-sm text-slate-300 mb-3">This certifies that</p>
          <div class="text-2xl sm:text-3xl font-black text-amber-300 border-b-2 border-amber-400/50 inline-block px-10 pb-2 mb-4">
            ${state.playerName}
          </div>
          <p class="text-xs sm:text-sm text-slate-300 max-w-xl mx-auto leading-relaxed mb-6">
            has successfully completed all <strong>6 Progressive Modules (36 Clinical Cases)</strong> in <em>Insulin Pharmacology & Clinical Therapeutics</em> with a cumulative score of <strong class="text-amber-300">${state.totalScore} points</strong>.
          </p>

          <div class="flex flex-wrap justify-center gap-3">
            <button onclick="window.print()" class="gold-cta px-7 py-3 rounded-xl font-black text-sm">
              🖨️ Print / Save Certificate
            </button>
            <button onclick="renderMap()" class="px-6 py-3 rounded-xl bg-slate-950 hover:bg-slate-900 text-slate-200 font-bold text-sm border border-slate-700">
              Back to Modules
            </button>
          </div>
        </div>
      `;
    }

    // Boot
    updateHeader();
    renderHome();
  </script>
</body>
</html>
