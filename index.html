    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    const sfx = {
      correct: () => { playTone(587.33, 'sine', 0.13, 0); playTone(880, 'sine', 0.22, 0.09); },

        subtitle: "Drug Interactions, Dawn vs Somogyi & Counseling",
        icon: "👑",
        timePerQ: 30,
        questions: [
          {

            options: ["Euglycemic Diabetic Ketoacidosis (euDKA)", "Somogyi Effect", "Insulin Edema", "Dawn Phenomenon"],
            correct: 0,
            hint: "SGLT2 inhibitors flush glucose into the urine, keeping blood sugar < 250 mg/dL even during active ketoacidosis.",
            explanation: "Euglycemic DKA occurs when SGLT2 inhibitors lower plasma glucose via glycosuria while fasting/low insulin triggers ketogenesis."
          },
          {
            q: "Why does combining Pioglitazone (a TZD) with insulin increase the risk of peripheral edema and heart failure?",
            options: ["Both drugs increase sodium and water reabsorption in the kidney's collecting duct", "Pioglitazone destroys heart valves", "Insulin blocks kidney blood flow completely", "They cause severe dehydration"],
            correct: 0,
            hint: "Both insulin and PPAR-gamma agonists stimulate renal ENaC sodium channels.",
            explanation: "Synergistic renal sodium and fluid retention can cause significant weight gain, edema, and heart failure exacerbation."
          },
          {

            options: ["Fluoroquinolones (e.g., Levofloxacin, Moxifloxacin)", "Penicillins (e.g., Amoxicillin)", "Tetracyclines (e.g., Doxycycline)", "Cephalosporins (e.g., Cephalexin)"],
            correct: 0,
            hint: "These antibiotics act similarly to sulfonylureas on pancreatic beta cells.",
            explanation: "Fluoroquinolones can block beta-cell KATP channels, stimulating inappropriate insulin release and severe hypoglycemia."
          },
          {
            q: "How do you distinguish the 'Somogyi Effect' from the 'Dawn Phenomenon' in a patient with high morning fasting blood glucose?",
            options: ["Check blood glucose at 3:00 AM: low (<70 mg/dL) indicates Somogyi Effect, while normal/rising indicates Dawn Phenomenon", "Check morning urine color", "Measure serum sodium", "Switch injection sites from abdomen to arm"],
            correct: 0,
            hint: "Somogyi is rebound hyperglycemia after nocturnal hypoglycemia; Dawn is an early-morning hormone surge.",
            explanation: "A 3:00 AM glucose <70 mg/dL confirms the Somogyi Effect (treated by lowering evening basal insulin), whereas normal 3:00 AM glucose confirms Dawn Phenomenon."
          },
          {
            q: "Why are non-selective beta-blockers (like Propranolol) used cautiously in insulin-treated patients?",
            options: ["They mask warning symptoms of hypoglycemia (rapid heartbeat and tremors), leaving sweating as the main clue", "They destroy insulin in the syringe", "They cause extreme hyperglycemia", "They prevent insulin absorption from the skin"],
            correct: 0,
            hint: "Adrenergic symptoms are blunted, while cholinergic sweating remains intact.",
            explanation: "Beta-blockers block tachycardia and tremor during hypoglycemia, increasing the risk of unrecognized severe low blood sugar."
          },
          {

          }
        ]
      }
    ];

    // --- State Management ---
    let state = {
      screen: 'home',
      playerName: '',
      unlockedStage: 1,
      completedStages: {},
      totalScore: 0,
      currentStageId: 1,
      qIndex: 0,
      hearts: 3, // Balanced: 3 lives per stage
      streak: 0,
      stageScore: 0,
      correctCount: 0,
      timer: 30,
      timerInterval: null,
      answered: false,
      lifelines: { fifty: true, hint: true, freeze: true },
      hiddenOptions: [],
      showHintBox: false,
      timeFrozen: false
    };

    const app = document.getElementById('appContainer');

    function updateHeader() {
      document.getElementById('globalScore').textContent = state.totalScore;
      const rankEl = document.getElementById('rankBadge');
      if (state.totalScore >= 4000) rankEl.textContent = "👑 MNU Board Master";
      else if (state.totalScore >= 2600) rankEl.textContent = "🩺 Clinical Specialist";
      else if (state.totalScore >= 1300) rankEl.textContent = "💊 Senior PharmD Candidate";
      else rankEl.textContent = "🎓 MNU Pharmacy Student";
    }

    // --- Screen 1: Royal Academic Home ---
    function renderHome() {
      clearInterval(state.timerInterval);
      state.screen = 'home';
      app.innerHTML = `
        <div class="luxury-card rounded-3xl p-6 sm:p-10 text-center animate-pop max-w-3xl mx-auto">

          <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-400/35 text-amber-300 px-4 py-1.5 rounded-full text-xs font-bold mb-4">
            <span>🏛️</span> Mansoura National University • Pharmacology & Toxicology Dept.
          </div>

          <h2 class="font-royal text-2xl sm:text-4xl font-black text-white mb-3 tracking-wide">
            INSULIN CLINICAL <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-500">CHALLENGE</span>
          </h2>
          <p class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-6 max-w-2xl mx-auto">
            Master <strong>36 clinical cases</strong> across <strong>6 specialized modules</strong>: Insulin Structure & SAR, Dosing Calculations, DKA/HHS Emergencies, Toxicology, Special Populations & Drug Interactions.
          </p>

          <!-- Student Name Input for Certificate -->
          <div class="max-w-md mx-auto mb-6">
            <input id="studentNameInput" type="text" value="${state.playerName}" placeholder="Enter your full name (for completion certificate)..."
                   class="w-full px-4 py-3 rounded-xl bg-slate-950/90 border border-amber-500/35 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-amber-400 text-center font-semibold">
          </div>

          <div class="grid grid-cols-3 gap-3 mb-7 text-left max-w-2xl mx-auto">
            <div class="bg-slate-950/80 border border-amber-500/20 p-3.5 rounded-2xl">
              <div class="text-lg mb-1">📚</div>
              <div class="font-bold text-amber-300 text-xs sm:text-sm">6 Modules</div>
              <div class="text-[11px] text-slate-400">36 Clinical Cases</div>
            </div>
            <div class="bg-slate-950/80 border border-amber-500/20 p-3.5 rounded-2xl">
              <div class="text-lg mb-1">❤️</div>
              <div class="font-bold text-emerald-400 text-xs sm:text-sm">3 Lives / Stage</div>
              <div class="text-[11px] text-slate-400">Pass ≥ 4/6 Cases</div>
            </div>
            <div class="bg-slate-950/80 border border-amber-500/20 p-3.5 rounded-2xl">
              <div class="text-lg mb-1">⏱️</div>
              <div class="font-bold text-sky-300 text-xs sm:text-sm">30s Timer</div>
              <div class="text-[11px] text-slate-400">+ 3 Consult Lifelines</div>
            </div>
          </div>

          <button onclick="enterExam()" class="gold-btn w-full sm:w-auto px-12 py-4 rounded-2xl font-black text-base sm:text-lg transition">
            Start Clinical Challenge 🚀
          </button>
        </div>
      `;
    }

    function enterExam() {
      const inputEl = document.getElementById('studentNameInput');
      if (inputEl) state.playerName = inputEl.value.trim() || "MNU Pharmacy Scholar";
      sfx.click();
      renderMap();
    }

    // --- Screen 2: Stage Map ---
    function renderMap() {
      clearInterval(state.timerInterval);
      state.screen = 'map';
      updateHeader();

      const allCompleted = Object.keys(state.completedStages).length === STAGES.length;

      const cardsHtml = STAGES.map(stage => {
        const isUnlocked = stage.id <= state.unlockedStage;
        const stars = state.completedStages[stage.id] || 0;
        return `
          <div onclick="${isUnlocked ? `startStage(${stage.id})` : ''}" 
               class="stage-card luxury-card rounded-2xl p-5 relative overflow-hidden ${isUnlocked ? 'cursor-pointer' : 'locked opacity-50 cursor-not-allowed'}">
            <div class="flex items-start justify-between mb-3">
              <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-amber-400/20 to-sky-500/20 border border-amber-400/40 flex items-center justify-center text-xl">
                ${isUnlocked ? stage.icon : '🔒'}
              </div>
              <div class="flex items-center gap-1 text-sm">
                ${[1, 2, 3].map(i => `<span class="${i <= stars ? 'text-amber-400' : 'text-slate-700'}">★</span>`).join('')}
              </div>
            </div>
            <h3 class="text-sm sm:text-base font-extrabold text-white leading-snug mb-1">${stage.title}</h3>
            <p class="text-xs text-slate-400 mb-4">${stage.subtitle}</p>
            <div class="flex items-center justify-between text-xs font-bold pt-3 border-t border-slate-800">
              <span class="text-sky-300">${stage.questions.length} Cases • 30s</span>
              <span class="${isUnlocked ? 'text-amber-400' : 'text-slate-500'}">
                ${stars > 0 ? 'Retake ↻' : (isUnlocked ? 'Enter →' : 'Locked')}
              </span>

          </div>
        `;
      }).join('');

      app.innerHTML = `
        <div class="animate-pop">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4 px-1">
            <div>
              <h2 class="text-lg sm:text-2xl font-black text-white">Candidate: <span class="text-amber-400">${state.playerName}</span></h2>
              <p class="text-xs text-slate-400">Score at least 4/6 correct answers per module to unlock the next level</p>
            </div>
            <div class="flex items-center gap-2">
              ${allCompleted ? `
                <button onclick="renderCertificate()" class="gold-btn text-xs font-black px-4 py-2 rounded-xl">
                  📜 View Certificate
                </button>
              ` : ''}
              <button onclick="sfx.click(); renderHome()" class="text-xs bg-slate-900 hover:bg-slate-800 text-slate-300 px-3.5 py-2 rounded-xl border border-amber-500/25">
                ← Home
              </button>

    }

    // --- Screen 3: Quiz Gameplay ---
    function startStage(stageId) {
      sfx.click();
      state.currentStageId = stageId;
      state.qIndex = 0;
      state.hearts = 3; // Balanced: 3 lives
      state.streak = 0;
      state.stageScore = 0;
      state.correctCount = 0;
      state.lifelines = { fifty: true, hint: true, freeze: true };
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(state.timerInterval);
      const stage = STAGES.find(s => s.id === state.currentStageId);
      state.answered = false;
      state.hiddenOptions = [];
      state.showHintBox = false;
      state.timeFrozen = false;
      state.timer = 30; // 30 seconds per question

      renderQuizUI();

      state.timerInterval = setInterval(() => {
        if (state.answered || state.timeFrozen) return;
        state.timer--;
        const timerEl = document.getElementById('timerText');
        const barEl = document.getElementById('timerBar');
        if (timerEl) timerEl.textContent = `${state.timer}s`;
        if (barEl) {
          const pct = Math.max(0, (state.timer / 30) * 100);
          barEl.style.width = `${pct}%`;
          if (state.timer <= 7) barEl.className = "h-full bg-rose-500 transition-all duration-300";
        }
        if (state.timer <= 0) {
          clearInterval(state.timerInterval);
          handleAnswer(-1);
        }
      }, 1000);
    }

    function renderQuizUI(selectedIdx = null) {
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const qObj = stage.questions[state.qIndex];
      const letters = ['A', 'B', 'C', 'D'];

      const heartsHtml = [1, 2, 3].map(h => 
        `<span class="text-base ${h <= state.hearts ? 'opacity-100' : 'opacity-25 grayscale'}">❤️</span>`
      ).join('');

      const optionsHtml = qObj.options.map((opt, idx) => {
        if (state.hiddenOptions.includes(idx)) {
          return `<div class="p-3.5 rounded-2xl border border-slate-800/50 bg-slate-950/40 text-slate-600 text-sm italic">Eliminated via 50:50</div>`;
        }
        let btnStyle = "bg-slate-950/85 border-slate-800 text-slate-100";
        let badgeStyle = "bg-slate-900 text-amber-400 border border-amber-500/30";

        if (state.answered) {
          if (idx === qObj.correct) {
            btnStyle = "bg-emerald-950/90 border-emerald-400 text-emerald-100 shadow-lg shadow-emerald-500/15";
            badgeStyle = "bg-emerald-500 text-slate-950";
          } else if (idx === selectedIdx) {
            btnStyle = "bg-rose-950/90 border-rose-500 text-rose-100 animate-shake";
            badgeStyle = "bg-rose-500 text-white";
          } else {
            btnStyle = "bg-slate-950/40 border-slate-800/60 text-slate-500";
          }
        }

        return `
          <button onclick="handleAnswer(${idx})" ${state.answered ? 'disabled' : ''} 
                  class="option-btn w-full text-left p-3.5 sm:p-4 rounded-2xl border ${btnStyle} flex items-center gap-3.5">
            <span class="w-8 h-8 rounded-xl ${badgeStyle} font-black text-xs flex items-center justify-center shrink-0">
              ${letters[idx]}
            </span>
            <span class="text-sm sm:text-base font-semibold leading-snug">${opt}</span>
          </button>
        `;
      }).join('');

      app.innerHTML = `
        <div class="luxury-card rounded-3xl p-5 sm:p-7 animate-pop">
          <!-- Top HUD -->
          <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-800">
            <div class="flex items-center gap-2">
              <button onclick="renderMap()" class="text-xs bg-slate-900 hover:bg-slate-800 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-700">✕ Exit</button>
              <span class="text-xs font-bold text-amber-300 bg-amber-500/10 px-3 py-1 rounded-lg border border-amber-400/25">
                ${stage.title.split(':')[0]} • Case ${state.qIndex + 1}/${stage.questions.length}
              </span>
            </div>

            <div class="flex items-center gap-3">
              ${state.streak >= 2 ? `<span class="text-xs font-black text-amber-400 bg-amber-500/15 px-2.5 py-1 rounded-lg">🔥 ${state.streak}x</span>` : ''}
              <div class="flex items-center gap-0.5">${heartsHtml}</div>
              <div class="text-xs font-black px-2.5 py-1 rounded-lg ${state.timeFrozen ? 'bg-sky-500/20 text-sky-300' : 'bg-slate-900 text-white border border-slate-700'}">
                ⏱️ <span id="timerText">${state.timeFrozen ? 'Frozen' : state.timer + 's'}</span>
              </div>
            </div>
          </div>

          <!-- Timer Progress Bar -->
          <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden mb-5">
            <div id="timerBar" class="h-full bg-gradient-to-r from-amber-400 to-sky-400 transition-all duration-300" style="width: ${(state.timer / 30) * 100}%"></div>
          </div>

          <!-- Question Text -->
          <h3 class="text-base sm:text-lg font-extrabold text-white leading-relaxed mb-5">
            ${qObj.q}
          </h3>

          <!-- Lifelines Bar -->
          <div class="flex flex-wrap items-center gap-2 mb-5">
            <span class="text-xs text-slate-400 font-semibold mr-1">Consultations:</span>
            <button onclick="useFiftyFifty()" ${!state.lifelines.fifty || state.answered ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${state.lifelines.fifty && !state.answered ? 'bg-sky-950/80 border-sky-500/40 text-sky-300 hover:bg-sky-900' : 'bg-slate-950 border-slate-800 text-slate-600 cursor-not-allowed'}">
              ✂️ 50:50
            </button>
            <button onclick="useHint()" ${!state.lifelines.hint || state.answered ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${state.lifelines.hint && !state.answered ? 'bg-amber-950/80 border-amber-500/40 text-amber-300 hover:bg-amber-900' : 'bg-slate-950 border-slate-800 text-slate-600 cursor-not-allowed'}">
              💡 Faculty Clue
            </button>
            <button onclick="useFreeze()" ${!state.lifelines.freeze || state.answered ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${state.lifelines.freeze && !state.answered ? 'bg-indigo-950/80 border-indigo-500/40 text-indigo-300 hover:bg-indigo-900' : 'bg-slate-950 border-slate-800 text-slate-600 cursor-not-allowed'}">
              ❄️ Freeze Clock
            </button>
          </div>

          <!-- Optional Hint Box -->
          ${state.showHintBox ? `
            <div class="mb-4 p-3.5 rounded-2xl bg-amber-500/10 border border-amber-400/35 text-amber-200 text-xs sm:text-sm flex items-start gap-2.5 animate-pop">
              <span class="text-base">💡</span>
              <div><strong>Pharmacology Clue:</strong> ${qObj.hint}</div>
            </div>
          ` : ''}

          <!-- Options Grid -->
          <div class="grid grid-cols-1 gap-3 mb-5">
            ${optionsHtml}
          </div>

          <!-- Clinical Rationale Card -->
          ${state.answered ? `
            <div class="p-4 rounded-2xl ${selectedIdx === qObj.correct ? 'bg-emerald-950/65 border-emerald-500/40' : 'bg-rose-950/65 border-rose-500/40'} border mb-4 animate-pop">
              <div class="font-black text-sm mb-1 ${selectedIdx === qObj.correct ? 'text-emerald-300' : 'text-rose-300'}">
                ${selectedIdx === qObj.correct ? '✅ Verified Clinical Answer:' : (selectedIdx === -1 ? '⏰ Time Expired — Clinical Rationale:' : '❌ Incorrect — Clinical Rationale:')}
              </div>
              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${qObj.explanation}</p>
            </div>
            <button onclick="nextStep()" class="gold-btn w-full py-3.5 rounded-2xl font-black text-base transition">
              ${state.hearts <= 0 ? 'View Module Evaluation →' : (state.qIndex + 1 < stage.questions.length ? 'Next Clinical Case →' : 'Complete Module 🏆')}
            </button>
          ` : ''}
        </div>
      `;
    }

    // --- Lifelines ---
    function useFiftyFifty() {
      if (!state.lifelines.fifty || state.answered) return;
      sfx.click();
      state.lifelines.fifty = false;
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const correctIdx = stage.questions[state.qIndex].correct;
      const wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIdx).sort(() => Math.random() - 0.5);
      state.hiddenOptions = wrongIndices.slice(0, 2);
      renderQuizUI();
    }

    function useHint() {
      if (!state.lifelines.hint || state.answered) return;
      sfx.click();
      state.lifelines.hint = false;
      state.showHintBox = true;
      renderQuizUI();
    }

    function useFreeze() {
      if (!state.lifelines.freeze || state.answered) return;
      sfx.click();
      state.lifelines.freeze = false;
      state.timeFrozen = true;
      renderQuizUI();
    }

    // --- Answer Evaluation ---
    function handleAnswer(selectedIdx) {
      if (state.answered) return;
      state.answered = true;
      clearInterval(state.timerInterval);

      const stage = STAGES.find(s => s.id === state.currentStageId);
      const qObj = stage.questions[state.qIndex];

      if (selectedIdx === qObj.correct) {
        sfx.correct();
        state.streak++;
        state.correctCount++;
        const speedBonus = Math.round(state.timer * 3);
        const streakBonus = state.streak > 1 ? state.streak * 20 : 0;
        const points = 120 + speedBonus + streakBonus;
        state.stageScore += points;
        state.totalScore += points;
        updateHeader();
      } else {
        sfx.wrong();
        state.streak = 0;
        state.hearts--;
      }

      renderQuizUI(selectedIdx);
    }

    function nextStep() {
      sfx.click();
      const stage = STAGES.find(s => s.id === state.currentStageId);
      if (state.hearts <= 0 || state.qIndex + 1 >= stage.questions.length) {
        renderStageResult();
      } else {
        state.qIndex++;
        loadQuestion();
      }
    }

    // --- Screen 4: Stage Result ---
    function renderStageResult() {
      clearInterval(state.timerInterval);
      const stage = STAGES.find(s => s.id === state.currentStageId);
      // Balanced passing requirement: >= 4 out of 6 correct
      const passed = state.hearts > 0 && state.correctCount >= 4;

      let stars = 0;
      if (passed) {
        sfx.win();
        stars = state.correctCount === 6 ? 3 : (state.correctCount === 5 ? 2 : 1);
        const prevStars = state.completedStages[stage.id] || 0;
        if (stars > prevStars) state.completedStages[stage.id] = stars;
        if (stage.id === state.unlockedStage && state.unlockedStage < STAGES.length) {
          state.unlockedStage++;
        }
      } else {
        sfx.wrong();
      }

      const hasNextStage = passed && stage.id < STAGES.length;
      const allCleared = Object.keys(state.completedStages).length === STAGES.length;

      app.innerHTML = `
        <div class="luxury-card rounded-3xl p-6 sm:p-10 text-center animate-pop max-w-xl mx-auto">
          <div class="text-5xl mb-3">${passed ? '🏆' : '💔'}</div>
          <h2 class="text-2xl sm:text-3xl font-black text-white mb-2">
            ${passed ? 'Module Passed!' : 'Module Not Passed'}
          </h2>
          <p class="text-sm text-slate-300 mb-6">
            ${passed 
              ? `Great clinical judgment in ${stage.title}.` 
              : 'You need at least 4/6 correct answers with remaining lives to unlock the next module.'}
          </p>

          <div class="flex justify-center gap-2 text-3xl mb-6">
            ${[1, 2, 3].map(i => `<span class="${i <= stars ? 'text-amber-400' : 'text-slate-700'}">★</span>`).join('')}
          </div>

          <div class="grid grid-cols-2 gap-3 mb-7">
            <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 mb-1">Cases Solved</div>
              <div class="text-xl font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">${state.correctCount} / ${stage.questions.length}</div>
            </div>
            <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 mb-1">Module Score</div>
              <div class="text-xl font-black text-amber-400">+${state.stageScore}</div>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button onclick="startStage(${stage.id})" class="px-6 py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm border border-slate-700 transition">
              Retry Module ↻
            </button>
            ${allCleared ? `
              <button onclick="renderCertificate()" class="gold-btn px-8 py-3.5 rounded-2xl font-black text-sm transition">
                Claim MNU Certificate 📜
              </button>
            ` : (hasNextStage ? `
              <button onclick="startStage(${stage.id + 1})" class="gold-btn px-8 py-3.5 rounded-2xl font-black text-sm transition">
                Next Module →
              </button>
            ` : `
              <button onclick="renderMap()" class="gold-btn px-8 py-3.5 rounded-2xl font-black text-sm transition">
                Back to Modules 🗺️
              </button>
            `)}
          </div>
        </div>
      `;
