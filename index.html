<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Insulin Challenge - Pharmacist's Journey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #060b14;
      color: #f1f5f9;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 45%),
        linear-gradient(to bottom, #060b14, #0b1324);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.22);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    }
    .stage-card {
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stage-card:not(.locked):hover {
      transform: translateY(-6px) scale(1.015);
      border-color: rgba(34, 211, 238, 0.6);
      box-shadow: 0 16px 40px rgba(6, 182, 212, 0.22);
    }
    .option-btn {
      transition: all 0.2s ease;
    }
    .option-btn:not(:disabled):hover {
      transform: translateX(4px);
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(56, 189, 248, 0.55);
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(34, 211, 238, 0.25); }
      50% { box-shadow: 0 0 32px rgba(34, 211, 238, 0.55); }
    }
    .glow-active {
      animation: pulseGlow 2.4s infinite;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shake 0.45s ease-in-out;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-4 sm:p-6">

  <!-- Top Navigation Header -->
  <header class="w-full max-w-4xl flex items-center justify-between glass-card rounded-2xl px-4 py-3 mb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-emerald-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg">
        💉
      </div>
      <div>
        <h1 class="font-extrabold text-base sm:text-lg text-white leading-tight">Insulin Challenge</h1>
        <p class="text-xs text-cyan-400 font-medium">Pharmacist's Clinical Journey</p>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-4">
      <div class="bg-slate-900/90 border border-slate-700/80 px-3 py-1.5 rounded-xl flex items-center gap-2">
        <span class="text-amber-400 text-sm">🏆</span>
        <span id="globalScore" class="font-bold text-sm text-amber-300">0</span>
      </div>
      <div id="rankBadge" class="hidden sm:flex bg-cyan-950/80 border border-cyan-500/30 px-3 py-1.5 rounded-xl text-xs font-bold text-cyan-300">
        Pharmacy Student
      </div>
      <button onclick="toggleSound()" id="soundBtn" title="Sound Effects" class="w-9 h-9 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-sm transition">
        🔊
      </button>
    </div>
  </header>

  <!-- Main Dynamic Container -->
  <main id="appContainer" class="w-full max-w-4xl flex-1 flex flex-col justify-center my-2">
    <!-- Screens rendered via JS -->
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-4xl text-center text-xs text-slate-500 mt-4 py-2">
    Interactive Clinical Pharmacy & Endocrinology Training • Unlock all 4 stages to earn Consultant Rank
  </footer>

  <script>
    // --- Audio Synthesizer (Web Audio API) ---
    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    const sfx = {
      correct: () => { playTone(523.25, 'sine', 0.14, 0); playTone(659.25, 'sine', 0.22, 0.1); },
      wrong: () => { playTone(220, 'sawtooth', 0.18, 0); playTone(165, 'sawtooth', 0.28, 0.14); },
      click: () => { playTone(440, 'triangle', 0.06, 0); },
      win: () => {
        playTone(523.25, 'sine', 0.15, 0);
        playTone(659.25, 'sine', 0.15, 0.12);
        playTone(783.99, 'sine', 0.15, 0.24);
        playTone(1046.50, 'sine', 0.35, 0.36);
      }
    };

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
    }

    // --- Game Curriculum Data (4 Stages, 20 Questions) ---
    const STAGES = [
      {
        id: 1,
        title: "Stage 1: Physiology & Pancreas",
        subtitle: "Beta Cells, Secretion & GLUT4",
        icon: "🧬",
        color: "from-cyan-500 to-blue-600",
        timePerQ: 25,
        questions: [
          {
            q: "Which specific pancreatic Islets of Langerhans cells synthesize and secrete insulin?",
            options: ["Alpha cells", "Beta cells", "Delta cells", "PP (F) cells"],
            correct: 1,
            hint: "Alpha cells secrete glucagon, whereas insulin comes from the most abundant islet cell type.",
            explanation: "Pancreatic Beta (β) cells produce and secrete insulin in response to elevated blood glucose, whereas Alpha cells secrete glucagon and Delta cells secrete somatostatin."
          },
          {
            q: "Which biomarker is co-secreted in equimolar amounts with endogenous insulin and helps differentiate endogenous production from exogenous insulin injection?",
            options: ["C-Peptide", "HbA1c", "Amylin", "Proglucagon"],
            correct: 0,
            hint: "It is cleaved from proinsulin inside secretory granules before release.",
            explanation: "C-Peptide (Connecting Peptide) is cleaved from proinsulin and released in equal molar amounts with endogenous insulin. Exogenous pharmaceutical insulin contains no C-peptide."
          },
          {
            q: "Which glucose transporter is insulin-dependent and translocates to the cell membrane of skeletal muscle and adipose tissue upon insulin receptor activation?",
            options: ["GLUT1", "GLUT2", "GLUT4", "SGLT2"],
            correct: 2,
            hint: "Think of the transporter stored in intracellular vesicles in muscle and fat cells.",
            explanation: "GLUT4 is stored in intracellular vesicles in skeletal muscle and adipocytes; insulin binding to its tyrosine kinase receptor triggers GLUT4 translocation to the plasma membrane."
          },
          {
            q: "What is the primary physiological effect of insulin on hepatic (liver) glycogen metabolism?",
            options: ["Stimulates glycogenolysis", "Stimulates glycogenesis and inhibits gluconeogenesis", "Increases ketone body synthesis", "Stimulates lipolysis"],
            correct: 1,
            hint: "Insulin is an anabolic storage hormone.",
            explanation: "Insulin promotes glucose storage as glycogen (glycogenesis) in the liver and muscles while suppressing hepatic glucose output (gluconeogenesis and glycogenolysis)."
          },
          {
            q: "In pancreatic beta cells, elevated intracellular ATP closes which ion channel to trigger depolarization and insulin exocytosis?",
            options: ["Voltage-gated Na+ channels", "ATP-sensitive K+ (KATP) channels", "Cl- channels", "Ligand-gated Ca2+ channels"],
            correct: 1,
            hint: "Sulfonylurea drugs bind to this exact channel complex (SUR1 subunit).",
            explanation: "Glucose metabolism raises the ATP/ADP ratio, closing ATP-sensitive K+ channels. This depolarizes the beta-cell membrane, opening voltage-gated Ca2+ channels and triggering insulin release."
          }
        ]
      },
      {
        id: 2,
        title: "Stage 2: Insulin Types & Kinetics",
        subtitle: "Onset, Peak, Duration & Mixing Rules",
        icon: "⏱️",
        color: "from-emerald-500 to-teal-600",
        timePerQ: 25,
        questions: [
          {
            q: "Which of the following is classified as a rapid-acting insulin analog administered 0–15 minutes before meals?",
            options: ["Insulin Glargine", "Insulin Lispro", "NPH Insulin", "Regular Insulin"],
            correct: 1,
            hint: "Its amino acid sequence at B28 and B29 is inverted to prevent hexamer formation.",
            explanation: "Insulin Lispro (along with Aspart and Glulisine) is a rapid-acting analog with an onset of 10–20 minutes, peak at 1–3 hours, and duration of 3–5 hours."
          },
          {
            q: "Which insulin is an intermediate-acting cloudy suspension that peaks at 4–10 hours and carries a notable risk of nocturnal hypoglycemia?",
            options: ["Insulin Detemir", "Insulin Degludec", "NPH (Isophane) Insulin", "Insulin Glulisine"],
            correct: 2,
            hint: "It contains protamine and zinc, giving it a cloudy appearance.",
            explanation: "NPH (Neutral Protamine Hagedorn) is an intermediate-acting cloudy suspension (onset 1–2 hrs, peak 4–10 hrs, duration 12–18 hrs) that must be gently rolled before injection."
          },
          {
            q: "Why should Insulin Glargine (Lantus) NEVER be mixed in the same syringe with any other insulin?",
            options: ["It causes immediate precipitation due to its acidic pH (pH 4)", "It destroys rapid-acting insulin enzymes", "It turns into a solid gel", "It doubles the absorption rate"],
            correct: 0,
            hint: "Glargine is formulated as a clear acidic solution that precipitates at neutral physiological pH.",
            explanation: "Insulin Glargine is formulated at an acidic pH (~4.0) to remain soluble in the vial; mixing it with neutral insulins alters its pH and ruins its predictable 24-hour flat profile."
          },
          {
            q: "When drawing up Regular insulin and NPH insulin into the same syringe, what is the golden rule?",
            options: ["Cloudy before Clear (NPH first)", "Clear before Cloudy (Regular first)", "Shake NPH vigorously first", "Order does not matter"],
            correct: 1,
            hint: "Think 'RN' — Regular before NPH to avoid contaminating the clear vial with protamine.",
            explanation: "Always draw 'Clear before Cloudy' (Regular before NPH) so that protamine from the cloudy NPH vial does not contaminate the clear Regular insulin vial."
          },
          {
            q: "Which ultra-long-acting basal insulin forms soluble multi-hexamers subcutaneously and has a duration of action exceeding 42 hours?",
            options: ["Insulin Degludec (Tresiba)", "Regular Insulin", "Insulin Aspart", "NPH Insulin"],
            correct: 0,
            hint: "Its half-life is approximately 25 hours, allowing flexible daily dosing.",
            explanation: "Insulin Degludec forms subcutaneous multi-hexamer chains that slowly release monomers, providing a flat basal profile lasting over 42 hours."
          }
        ]
      },
      {
        id: 3,
        title: "Stage 3: Clinical Cases & Emergencies",
        subtitle: "Hypoglycemia, DKA & Injection Technique",
        icon: "🚑",
        color: "from-amber-500 to-orange-600",
        timePerQ: 25,
        questions: [
          {
            q: "A conscious diabetic patient presents with tremors, sweating, and a blood glucose of 54 mg/dL. According to the 'Rule of 15', what is the first-line intervention?",
            options: ["Administer 15 units of Regular insulin", "Give 15–20 g of fast-acting carbohydrates and recheck in 15 minutes", "Give a high-fat chocolate bar immediately", "Inject IV potassium"],
            correct: 1,
            hint: "Fast-acting simple sugars (glucose tablets or 4 oz juice) raise blood sugar rapidly without fat delay.",
            explanation: "The Rule of 15 states: administer 15–20 g of fast-acting glucose (e.g., 3–4 glucose tablets or 120 mL fruit juice), wait 15 minutes, and recheck blood glucose."
          },
          {
            q: "In Diabetic Ketoacidosis (DKA) management, why must serum potassium (K+) be checked before starting an IV Regular insulin infusion?",
            options: ["Insulin drives extracellular K+ into cells, risking fatal hypokalemia", "Insulin causes severe hyperkalemia", "Potassium inactivates IV insulin", "DKA always causes high serum sodium"],
            correct: 0,
            hint: "Insulin stimulates the Na+/K+-ATPase pump.",
            explanation: "Insulin activates Na+/K+-ATPase pumps, shifting potassium intracellularly. If serum K+ is < 3.3 mEq/L, potassium must be repleted BEFORE starting insulin to prevent cardiac arrhythmias."
          },
          {
            q: "What complication occurs when a patient repeatedly injects insulin into the exact same abdominal spot without rotating sites?",
            options: ["Lipohypertrophy, leading to erratic insulin absorption", "Severe anaphylaxis", "Permanent nerve paralysis", "Hyperthyroidism"],
            correct: 0,
            hint: "Rubbery, thickened fatty lumps form under the skin.",
            explanation: "Repeated injections in the same site cause lipohypertrophy (thickened, rubbery subcutaneous fat), which significantly delays and destabilizes insulin absorption."
          },
          {
            q: "A patient has elevated fasting morning blood glucose (210 mg/dL) caused by an early-morning surge in growth hormone and cortisol without nocturnal hypoglycemia. What is this phenomenon called?",
            options: ["Somogyi Effect", "Dawn Phenomenon", "Honeymoon Phase", "Brittle Diabetes"],
            correct: 1,
            hint: "It occurs naturally around 4:00–8:00 AM due to counter-regulatory hormones.",
            explanation: "The Dawn Phenomenon is early-morning hyperglycemia caused by physiologic surges in cortisol and growth hormone, whereas the Somogyi Effect is rebound hyperglycemia following nocturnal hypoglycemia."
          },
          {
            q: "Which route and insulin type are strictly used for initial inpatient IV infusion in Diabetic Ketoacidosis (DKA)?",
            options: ["IV Regular Insulin", "IV Insulin Glargine", "IV NPH Insulin", "Subcutaneous Degludec"],
            correct: 0,
            hint: "Only clear, short-acting human insulin is approved for continuous intravenous infusion.",
            explanation: "Regular insulin is the standard insulin for IV infusion in DKA due to its short plasma half-life (~5–7 minutes IV), allowing rapid titration."
          }
        ]
      },
      {
        id: 4,
        title: "Stage 4: Boss Challenge",
        subtitle: "Drug Interactions & Complex Scenarios",
        icon: "👑",
        color: "from-purple-500 to-pink-600",
        timePerQ: 20,
        questions: [
          {
            q: "Non-selective beta-blockers (e.g., Propranolol) pose a dual danger in insulin-treated diabetic patients because they:",
            options: ["Mask adrenergic hypoglycemia symptoms (tachycardia/tremors) and delay glycogenolysis recovery", "Cause rapid insulin degradation in the liver", "Increase renal glucose excretion", "Stimulate excessive insulin secretion"],
            correct: 0,
            hint: "Sweating remains intact, while palpitations and tremors are blunted.",
            explanation: "Beta-blockers mask sympathetic warning signs of hypoglycemia (palpitations, tremor)—leaving diaphoresis (sweating) as a key clue—and impair beta-2 mediated hepatic glycogenolysis."
          },
          {
            q: "When initiating high-dose systemic corticosteroids (e.g., Prednisone 40 mg/day) in a patient on insulin, what glycemic adjustment is typically required?",
            options: ["Increase insulin doses (especially prandial/afternoon coverage) due to steroid-induced insulin resistance", "Discontinue all basal insulin", "Switch to oral sulfonylureas only", "Reduce insulin by 50%"],
            correct: 0,
            hint: "Glucocorticoids promote hepatic gluconeogenesis and peripheral insulin resistance.",
            explanation: "Systemic corticosteroids induce marked insulin resistance and postprandial hyperglycemia, typically requiring proactive escalation of insulin doses."
          },
          {
            q: "How should an unopened insulin vial or pen be stored, and how long can an in-use vial/pen typically remain at room temperature (< 25–30°C)?",
            options: ["Refrigerated (2–8°C) until opened; once in use, keep at room temperature for up to 28 days", "Frozen at -10°C until needed", "Always refrigerated even during injection", "In direct sunlight for 60 days"],
            correct: 0,
            hint: "Injecting cold insulin directly from the fridge causes pain and local irritation.",
            explanation: "Unopened insulin is stored at 2–8°C (never frozen). Once opened/in-use, most insulins are kept at room temperature for up to 28 days (42 days for Levemir/Tresiba) to minimize injection pain."
          },
          {
            q: "Which is the ONLY insulin product approved for intravenous (IV) administration among standard outpatient basal and human insulins?",
            options: ["Regular Human Insulin", "NPH Insulin", "Insulin Glargine", "Insulin Detemir"],
            correct: 0,
            hint: "Suspensions and long-acting precipitants cannot enter the bloodstream directly.",
            explanation: "Only Regular insulin (and certain rapid-acting analogs in hospital protocols) can be given IV; NPH and basal analogs are strictly for subcutaneous injection."
          },
          {
            q: "A Type 1 Diabetes patient with nausea and vomiting cannot eat solid food. What critical counseling point must the pharmacist emphasize regarding their basal insulin?",
            options: ["Never omit basal insulin during illness; monitor blood glucose and ketones frequently", "Stop all insulin until solid food is resumed", "Double the rapid-acting mealtime dose without eating", "Drink only caffeinated beverages"],
            correct: 0,
            hint: "Sick-day stress hormones raise blood glucose even when fasting.",
            explanation: "During sick days, stress hormones drive hepatic glucose production and ketogenesis. Omitting basal insulin in Type 1 Diabetes can rapidly precipitate life-threatening DKA."
          }
        ]
      }
    ];

    // --- State Management ---
    let state = {
      screen: 'home', // home, map, quiz, stageResult
      unlockedStage: 1,
      completedStages: {},
      totalScore: 0,
      currentStageId: 1,
      qIndex: 0,
      hearts: 3,
      streak: 0,
      stageScore: 0,
      correctCount: 0,
      timer: 25,
      timerInterval: null,
      answered: false,
      lifelines: { fifty: true, hint: true, freeze: true },
      hiddenOptions: [],
      showHintBox: false,
      timeFrozen: false
    };

    const app = document.getElementById('appContainer');

    function updateHeader() {
      document.getElementById('globalScore').textContent = state.totalScore;
      const rankEl = document.getElementById('rankBadge');
      if (state.totalScore >= 1600) rankEl.textContent = "👑 Endocrinology Consultant";
      else if (state.totalScore >= 1000) rankEl.textContent = "🩺 Senior Clinical Pharmacist";
      else if (state.totalScore >= 450) rankEl.textContent = "💊 Resident Pharmacist";
      else rankEl.textContent = "🎓 Pharmacy Student";
    }

    // --- Screen 1: Home / Intro ---
    function renderHome() {
      clearInterval(state.timerInterval);
      state.screen = 'home';
      app.innerHTML = `
        <div class="glass-card rounded-3xl p-6 sm:p-10 text-center animate-pop max-w-2xl mx-auto">
          <div class="inline-flex items-center gap-2 bg-cyan-500/15 border border-cyan-400/30 text-cyan-300 px-4 py-1.5 rounded-full text-xs font-bold mb-5">
            <span>🧪</span> Interactive Clinical Pharmacy Game
          </div>
          <h2 class="text-3xl sm:text-5xl font-black text-white mb-4 tracking-tight">
            Insulin <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400">Challenge</span>
          </h2>
          <p class="text-slate-300 text-sm sm:text-base leading-relaxed mb-8 max-w-xl mx-auto">
            Advance through 4 progressive clinical stages—from pancreatic Beta-cell physiology and insulin pharmacokinetics to emergency DKA & hypoglycemia management.
          </p>

          <div class="grid grid-cols-3 gap-3 mb-8 text-left">
            <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl">
              <div class="text-xl mb-1">🗺️</div>
              <div class="font-bold text-white text-sm">4 Stages</div>
              <div class="text-xs text-slate-400">20 Clinical Questions</div>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl">
              <div class="text-xl mb-1">❤️</div>
              <div class="font-bold text-white text-sm">3 Lives</div>
              <div class="text-xs text-slate-400">Per Stage Attempt</div>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl">
              <div class="text-xl mb-1">🛟</div>
              <div class="font-bold text-white text-sm">3 Lifelines</div>
              <div class="text-xs text-slate-400">50:50, Hint & Freeze</div>
            </div>
          </div>

          <button onclick="sfx.click(); renderMap()" class="w-full sm:w-auto px-10 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 font-black text-lg shadow-xl glow-active transition transform hover:scale-105">
            Start Journey 🚀
          </button>
        </div>
      `;
    }

    // --- Screen 2: Stage Map ---
    function renderMap() {
      clearInterval(state.timerInterval);
      state.screen = 'map';
      updateHeader();

      const cardsHtml = STAGES.map(stage => {
        const isUnlocked = stage.id <= state.unlockedStage;
        const stars = state.completedStages[stage.id] || 0;
        return `
          <div onclick="${isUnlocked ? `startStage(${stage.id})` : ''}" 
               class="stage-card glass-card rounded-2xl p-5 relative overflow-hidden ${isUnlocked ? 'cursor-pointer' : 'locked opacity-55 cursor-not-allowed'}">
            <div class="flex items-start justify-between mb-3">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${stage.color} flex items-center justify-center text-2xl shadow-lg">
                ${isUnlocked ? stage.icon : '🔒'}
              </div>
              <div class="flex items-center gap-1 text-sm">
                ${[1, 2, 3].map(i => `<span class="${i <= stars ? 'text-amber-400' : 'text-slate-700'}">★</span>`).join('')}
              </div>
            </div>
            <h3 class="text-base sm:text-lg font-black text-white leading-snug mb-1">${stage.title}</h3>
            <p class="text-xs text-slate-400 mb-4">${stage.subtitle}</p>
            <div class="flex items-center justify-between text-xs font-bold pt-3 border-t border-slate-800/80">
              <span class="text-cyan-400">${stage.questions.length} Questions • ${stage.timePerQ}s</span>
              <span class="${isUnlocked ? 'text-emerald-400' : 'text-slate-500'}">
                ${stars > 0 ? 'Replay ↻' : (isUnlocked ? 'Play Now →' : 'Locked')}
              </span>
            </div>
          </div>
        `;
      }).join('');

      app.innerHTML = `
        <div class="animate-pop">
          <div class="flex items-center justify-between mb-4 px-1">
            <div>
              <h2 class="text-xl sm:text-2xl font-black text-white">Select Clinical Stage</h2>
              <p class="text-xs text-slate-400">Pass each stage (≥ 3/5 correct) to unlock the next level</p>
            </div>
            <button onclick="sfx.click(); renderHome()" class="text-xs bg-slate-800/90 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl border border-slate-700">
              ← Main Menu
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${cardsHtml}
          </div>
        </div>
      `;
    }

    // --- Screen 3: Active Quiz Gameplay ---
    function startStage(stageId) {
      sfx.click();
      const stage = STAGES.find(s => s.id === stageId);
      state.currentStageId = stageId;
      state.qIndex = 0;
      state.hearts = 3;
      state.streak = 0;
      state.stageScore = 0;
      state.correctCount = 0;
      state.lifelines = { fifty: true, hint: true, freeze: true };
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(state.timerInterval);
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const qObj = stage.questions[state.qIndex];
      state.answered = false;
      state.hiddenOptions = [];
      state.showHintBox = false;
      state.timeFrozen = false;
      state.timer = stage.timePerQ;

      renderQuizUI();

      state.timerInterval = setInterval(() => {
        if (state.answered || state.timeFrozen) return;
        state.timer--;
        const timerEl = document.getElementById('timerText');
        const barEl = document.getElementById('timerBar');
        if (timerEl) timerEl.textContent = `${state.timer}s`;
        if (barEl) {
          const pct = Math.max(0, (state.timer / stage.timePerQ) * 100);
          barEl.style.width = `${pct}%`;
          if (state.timer <= 6) barEl.className = "h-full bg-rose-500 transition-all duration-300";
        }
        if (state.timer <= 0) {
          clearInterval(state.timerInterval);
          handleAnswer(-1); // Time out
        }
      }, 1000);
    }

    function renderQuizUI(selectedIdx = null) {
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const qObj = stage.questions[state.qIndex];
      const letters = ['A', 'B', 'C', 'D'];

      const heartsHtml = [1, 2, 3].map(h => 
        `<span class="text-base sm:text-lg ${h <= state.hearts ? 'opacity-100' : 'opacity-25 grayscale'}">❤️</span>`
      ).join('');

      const optionsHtml = qObj.options.map((opt, idx) => {
        if (state.hiddenOptions.includes(idx)) {
          return `<div class="p-4 rounded-2xl border border-slate-800/50 bg-slate-900/30 text-slate-600 text-sm italic">Eliminated (50:50)</div>`;
        }
        let btnStyle = "bg-slate-900/80 border-slate-700/80 text-slate-100";
        let badgeStyle = "bg-slate-800 text-cyan-400";

        if (state.answered) {
          if (idx === qObj.correct) {
            btnStyle = "bg-emerald-950/90 border-emerald-400 text-emerald-100 shadow-lg shadow-emerald-500/15";
            badgeStyle = "bg-emerald-500 text-slate-950";
          } else if (idx === selectedIdx) {
            btnStyle = "bg-rose-950/90 border-rose-500 text-rose-100 animate-shake";
            badgeStyle = "bg-rose-500 text-white";
          } else {
            btnStyle = "bg-slate-900/40 border-slate-800 text-slate-500";
          }
        }

        return `
          <button onclick="handleAnswer(${idx})" ${state.answered ? 'disabled' : ''} 
                  class="option-btn w-full text-left p-3.5 sm:p-4 rounded-2xl border ${btnStyle} flex items-center gap-3.5">
            <span class="w-8 h-8 rounded-xl ${badgeStyle} font-black text-xs flex items-center justify-center shrink-0">
              ${letters[idx]}
            </span>
            <span class="text-sm sm:text-base font-semibold leading-snug">${opt}</span>
          </button>
        `;
      }).join('');

      app.innerHTML = `
        <div class="glass-card rounded-3xl p-5 sm:p-7 animate-pop">
          <!-- Top HUD -->
          <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-800">
            <div class="flex items-center gap-2">
              <button onclick="renderMap()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg">✕ Exit</button>
              <span class="text-xs font-bold text-cyan-400 bg-cyan-950/70 px-3 py-1 rounded-lg border border-cyan-500/20">
                ${stage.title.split(':')[0]} • Q ${state.qIndex + 1}/${stage.questions.length}
              </span>
            </div>

            <div class="flex items-center gap-3">
              ${state.streak >= 2 ? `<span class="text-xs font-black text-amber-400 bg-amber-500/15 px-2.5 py-1 rounded-lg">🔥 ${state.streak}x Streak</span>` : ''}
              <div class="flex items-center gap-0.5">${heartsHtml}</div>
              <div class="text-xs font-black px-2.5 py-1 rounded-lg ${state.timeFrozen ? 'bg-sky-500/20 text-sky-300' : 'bg-slate-800 text-white'}">
                ⏱️ <span id="timerText">${state.timeFrozen ? 'Frozen' : state.timer + 's'}</span>
              </div>
            </div>
          </div>

          <!-- Timer Progress Bar -->
          <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-5">
            <div id="timerBar" class="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 transition-all duration-300" style="width: ${(state.timer / stage.timePerQ) * 100}%"></div>
          </div>

          <!-- Question Text -->
          <h3 class="text-lg sm:text-xl font-extrabold text-white leading-relaxed mb-5">
            ${qObj.q}
          </h3>

          <!-- Lifelines Bar -->
          <div class="flex items-center gap-2 mb-5">
            <span class="text-xs text-slate-400 font-semibold mr-1">Lifelines:</span>
            <button onclick="useFiftyFifty()" ${!state.lifelines.fifty || state.answered ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${state.lifelines.fifty && !state.answered ? 'bg-indigo-950/80 border-indigo-500/40 text-indigo-300 hover:bg-indigo-900' : 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed'}">
              ✂️ 50:50
            </button>
            <button onclick="useHint()" ${!state.lifelines.hint || state.answered ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${state.lifelines.hint && !state.answered ? 'bg-amber-950/80 border-amber-500/40 text-amber-300 hover:bg-amber-900' : 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed'}">
              💡 Hint
            </button>
            <button onclick="useFreeze()" ${!state.lifelines.freeze || state.answered ? 'disabled' : ''} 
                    class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${state.lifelines.freeze && !state.answered ? 'bg-sky-950/80 border-sky-500/40 text-sky-300 hover:bg-sky-900' : 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed'}">
              ❄️ Freeze
            </button>
          </div>

          <!-- Optional Hint Box -->
          ${state.showHintBox ? `
            <div class="mb-4 p-3.5 rounded-2xl bg-amber-500/10 border border-amber-400/30 text-amber-200 text-xs sm:text-sm flex items-start gap-2.5 animate-pop">
              <span class="text-base">💡</span>
              <div><strong>Clinical Clue:</strong> ${qObj.hint}</div>
            </div>
          ` : ''}

          <!-- Options Grid -->
          <div class="grid grid-cols-1 gap-3 mb-5">
            ${optionsHtml}
          </div>

          <!-- Immediate Scientific Explanation Card -->
          ${state.answered ? `
            <div class="p-4 rounded-2xl ${selectedIdx === qObj.correct ? 'bg-emerald-950/60 border-emerald-500/40' : 'bg-rose-950/60 border-rose-500/40'} border mb-4 animate-pop">
              <div class="font-black text-sm mb-1 ${selectedIdx === qObj.correct ? 'text-emerald-300' : 'text-rose-300'}">
                ${selectedIdx === qObj.correct ? '✅ Spot On! Clinical Pearl:' : (selectedIdx === -1 ? '⏰ Time Expired! Clinical Pearl:' : '❌ Incorrect — Clinical Pearl:')}
              </div>
              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${qObj.explanation}</p>
            </div>
            <button onclick="nextStep()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 font-black text-base shadow-lg transition">
              ${state.hearts <= 0 ? 'View Stage Summary →' : (state.qIndex + 1 < stage.questions.length ? 'Next Question →' : 'Finish Stage 🏆')}
            </button>
          ` : ''}
        </div>
      `;
    }

    // --- Lifelines Handlers ---
    function useFiftyFifty() {
      if (!state.lifelines.fifty || state.answered) return;
      sfx.click();
      state.lifelines.fifty = false;
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const correctIdx = stage.questions[state.qIndex].correct;
      const wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIdx);
      wrongIndices.sort(() => Math.random() - 0.5);
      state.hiddenOptions = wrongIndices.slice(0, 2);
      renderQuizUI();
    }

    function useHint() {
      if (!state.lifelines.hint || state.answered) return;
      sfx.click();
      state.lifelines.hint = false;
      state.showHintBox = true;
      renderQuizUI();
    }

    function useFreeze() {
      if (!state.lifelines.freeze || state.answered) return;
      sfx.click();
      state.lifelines.freeze = false;
      state.timeFrozen = true;
      renderQuizUI();
    }

    // --- Answer Validation ---
    function handleAnswer(selectedIdx) {
      if (state.answered) return;
      state.answered = true;
      clearInterval(state.timerInterval);

      const stage = STAGES.find(s => s.id === state.currentStageId);
      const qObj = stage.questions[state.qIndex];

      if (selectedIdx === qObj.correct) {
        sfx.correct();
        state.streak++;
        state.correctCount++;
        const speedBonus = Math.round(state.timer * 3);
        const streakBonus = state.streak > 1 ? state.streak * 15 : 0;
        const points = 100 + speedBonus + streakBonus;
        state.stageScore += points;
        state.totalScore += points;
        updateHeader();
      } else {
        sfx.wrong();
        state.streak = 0;
        state.hearts--;
      }

      renderQuizUI(selectedIdx);
    }

    function nextStep() {
      sfx.click();
      const stage = STAGES.find(s => s.id === state.currentStageId);
      if (state.hearts <= 0 || state.qIndex + 1 >= stage.questions.length) {
        renderStageResult();
      } else {
        state.qIndex++;
        loadQuestion();
      }
    }

    // --- Screen 4: Stage Summary ---
    function renderStageResult() {
      clearInterval(state.timerInterval);
      const stage = STAGES.find(s => s.id === state.currentStageId);
      const passed = state.hearts > 0 && state.correctCount >= 3;

      let stars = 0;
      if (passed) {
        sfx.win();
        stars = state.correctCount === 5 ? 3 : (state.correctCount === 4 ? 2 : 1);
        const prevStars = state.completedStages[stage.id] || 0;
        if (stars > prevStars) state.completedStages[stage.id] = stars;
        if (stage.id === state.unlockedStage && state.unlockedStage < STAGES.length) {
          state.unlockedStage++;
        }
      } else {
        sfx.wrong();
      }

      const hasNextStage = passed && stage.id < STAGES.length;

      app.innerHTML = `
        <div class="glass-card rounded-3xl p-6 sm:p-10 text-center animate-pop max-w-xl mx-auto">
          <div class="text-5xl mb-3">${passed ? '🏆' : '💔'}</div>
          <h2 class="text-2xl sm:text-3xl font-black text-white mb-2">
            ${passed ? 'Stage Cleared!' : 'Out of Hearts!'}
          </h2>
          <p class="text-sm text-slate-300 mb-6">
            ${passed 
              ? `Great clinical reasoning in ${stage.title}.` 
              : 'Review the clinical pearls and try again to unlock the next stage.'}
          </p>

          <div class="flex justify-center gap-2 text-3xl mb-6">
            ${[1, 2, 3].map(i => `<span class="${i <= stars ? 'text-amber-400' : 'text-slate-700'}">★</span>`).join('')}
          </div>

          <div class="grid grid-cols-2 gap-3 mb-7">
            <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 mb-1">Correct Answers</div>
              <div class="text-xl font-black text-emerald-400">${state.correctCount} / ${stage.questions.length}</div>
            </div>
            <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 mb-1">Stage Points</div>
              <div class="text-xl font-black text-amber-400">+${state.stageScore}</div>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button onclick="startStage(${stage.id})" class="px-6 py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm border border-slate-700 transition">
              Replay Stage ↻
            </button>
            ${hasNextStage ? `
              <button onclick="startStage(${stage.id + 1})" class="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 font-black text-sm shadow-lg transition">
                Next Stage →
              </button>
            ` : `
              <button onclick="renderMap()" class="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 font-black text-sm shadow-lg transition">
                Back to Stage Map 🗺️
              </button>
            `}
          </div>
        </div>
      `;
    }

    // Boot Game
    updateHeader();
    renderHome();
  </script>
</body>
</html>
